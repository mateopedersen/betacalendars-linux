name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gir1.2-gtk-4.0 python3-gi xvfb
      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . black build ruff
      - name: Lint
        run: ruff check src tests scripts
      - name: Check formatting
        run: black --check --line-length 100 src tests scripts
      - name: Run automated tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build Python distributions
        run: python -m build
      - name: Launch GTK application and capture real screenshots under Xvfb
        run: |
          PYTHONPATH=src xvfb-run -a /usr/bin/python3 scripts/capture_screenshots.py docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: betacalendars-linux-screenshots-${{ github.sha }}
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Validate AppStream metadata
        run: |
          sudo apt-get install --yes appstream
          appstreamcli validate --no-net data/org.betacalendars.Studio.metainfo.xml

  snap-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: snapcraft
      - name: Smoke test the confined Snap CLI
        run: |
          sudo snap install --dangerous "${{ steps.snapcraft.outputs.snap }}"
          test "$(snap run betacalendars version)" = "1.0.0"
      - name: Inspect built snap metadata
        run: |
          unsquashfs -cat "${{ steps.snapcraft.outputs.snap }}" meta/snap.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: betacalendars-snap-${{ github.sha }}
          path: "${{ steps.snapcraft.outputs.snap }}"
          if-no-files-found: error
