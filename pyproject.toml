[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betacalendars-studio"
version = "1.0.0"
description = "Offline calendar layout and civil-date tools for Linux"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Beta Calendars" }]
dependencies = []

[project.scripts]
betacalendars = "betacalendars_studio.cli:main"
betacalendars-studio = "betacalendars_studio.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
